<div id="jellyfeatured_div">
    <style>{{CSS_STYLES}}</style>
    
    <div class="featured-carousel-container">
        <button id="featured-prev" class="nav-button nav-prev" aria-label="Previous">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
        </button>
        
        <div class="featured-carousel-track">
            <div id="featured-items-container">
                <!-- Example poster item structure -->
                <div class="featured-item">
                    <div class="loading-placeholder"></div>
                    <img src="" alt="Poster" loading="lazy" />
                </div>
                <!-- Repeat for other items dynamically -->
            </div>
        </div>
        
        <!-- Progress bar for current featured item -->
        <div class="featured-progress-container">
            <div id="featured-progress-bar" class="featured-progress-bar"></div>
        </div>
        
        <button id="featured-next" class="nav-button nav-next" aria-label="Next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
        </button>
    </div>
</div>
