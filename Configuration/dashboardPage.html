<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jellyfeatured</title>
</head>
<body>
    <div id="jellyfeaturedPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <div class="sectionTitleContainer flex align-items-center">
                    <h2 class="sectionTitle">Jellyfeatured</h2>
                </div>

                <form id="jellyfeatured-config-form">
                    <div class="inputContainer">
                        <label class="inputLabel" for="jellyfeatured-autoslide-interval">
                            Auto-advance interval (seconds)
                        </label>
                        <input id="jellyfeatured-autoslide-interval"
                               type="number" min="1" max="60" step="1"
                               class="emby-input"
                               style="width:100px;" />
                        <div class="fieldDescription">
                            How long each featured item is shown before the carousel advances automatically.
                        </div>
                    </div>

                    <div class="inputContainer" style="margin-top:24px;">
                        <label class="inputLabel">Custom List</label>
                        <div class="fieldDescription" style="margin-bottom:8px;">
                            Search and add movies or series. Each item appears individually in the order list below
                            where it can be enabled, disabled, or reordered independently.
                        </div>
                        <div style="position:relative;max-width:420px;">
                            <input id="jellyfeatured-featured-search"
                                   type="text" placeholder="Search to add..."
                                   class="emby-input" style="width:100%;" autocomplete="off" />
                            <ul id="jellyfeatured-featured-dropdown" style="
                                list-style:none;margin:0;padding:0;
                                position:absolute;left:0;right:0;z-index:100;
                                display:none;
                                background:var(--cardBackground,#1f1f1f);
                                border:1px solid var(--dividerColor,#333);
                                border-radius:0 0 4px 4px;
                                max-height:220px;overflow-y:auto;
                            "></ul>
                        </div>
                    </div>

                    <div class="inputContainer" style="margin-top:24px;">
                        <label class="inputLabel">Featured item order</label>
                        <div class="fieldDescription" style="margin-bottom:8px;">
                            Drag to reorder. Uncheck to hide a category.
                        </div>
                        <ul id="jellyfeatured-category-list" style="
                            list-style:none; margin:0; padding:0;
                            max-width:420px;
                        "></ul>
                        <button id="jellyfeatured-refresh-btn" type="button" class="raised emby-button" style="margin-top:12px;">
                            <span class="material-icons" style="vertical-align:middle;margin-right:6px;font-size:1.1em;">refresh</span>
                            <span>Refresh featured items</span>
                        </button>
                    </div>

                    <div class="settingsActions" style="margin-top:16px; display:flex; align-items:center; gap:12px;">
                        <button type="submit" class="raised button-submit emby-button">
                            <span>Save</span>
                        </button>
                        <span id="jellyfeatured-status" style="color:var(--textColorSecondary,#aaa);font-size:0.9rem;"></span>
                    </div>
                </form>


                <script>
                    (function () {
                        const PLUGIN_ID = '639b5171-918b-4b24-82e4-d35c10be63a4';

                        const ALL_CATEGORIES = [
                            { key: 'latestRelease',        label: 'Latest Release' },
                            { key: 'recentlyAddedFilms',   label: 'Recently Added in Films' },
                            { key: 'recentlyAddedSeries',  label: 'Recently Added in Series' },
                            { key: 'bestRatedFilms',       label: 'Best Rated in Films' },
                            { key: 'bestRatedSeries',      label: 'Best Rated in Series' },
                            { key: 'trending',             label: 'Trending' },
                            { key: 'randomPick',           label: 'Random Pick' },
                        ];

                        const form = document.getElementById('jellyfeatured-config-form');
                        const intervalInput = document.getElementById('jellyfeatured-autoslide-interval');
                        const categoryList = document.getElementById('jellyfeatured-category-list');
                        const refreshBtn = document.getElementById('jellyfeatured-refresh-btn');
                        const status = document.getElementById('jellyfeatured-status');
                        // ── Custom List (Featured items — multiple) ───────────────────────────
                        // featuredItems: [{id, title, year}]
                        let featuredItems = [];

                        const featuredSearchEl = document.getElementById('jellyfeatured-featured-search');
                        const featuredDropdownEl = document.getElementById('jellyfeatured-featured-dropdown');
                        let featuredSearchDebounce = null;

                        featuredSearchEl.addEventListener('input', () => {
                            clearTimeout(featuredSearchDebounce);
                            const q = featuredSearchEl.value.trim();
                            if (q.length < 2) { featuredDropdownEl.style.display = 'none'; return; }
                            featuredSearchDebounce = setTimeout(async () => {
                                try {
                                    const url = apiUrl('Items', {
                                        searchTerm: q,
                                        IncludeItemTypes: 'Movie,Series',
                                        Recursive: true,
                                        Limit: 8,
                                        Fields: 'PremiereDate'
                                    });
                                    const resp = await fetch(url, { credentials: 'same-origin' });
                                    const data = await resp.json();
                                    const items = (data && data.Items) || [];

                                    featuredDropdownEl.innerHTML = '';
                                    if (items.length === 0) { featuredDropdownEl.style.display = 'none'; return; }

                                    items.forEach(item => {
                                        const year = item.PremiereDate ? new Date(item.PremiereDate).getFullYear() : '';
                                        const li = document.createElement('li');
                                        li.style.cssText = 'padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--dividerColor,#333);';
                                        li.textContent = item.Name + (year ? ' (' + year + ')' : '') + ' — ' + item.Type;
                                        li.addEventListener('mouseenter', () => { li.style.background = 'var(--focusColor,rgba(255,255,255,.1))'; });
                                        li.addEventListener('mouseleave', () => { li.style.background = ''; });
                                        li.addEventListener('mousedown', (e) => {
                                            e.preventDefault();
                                            if (!featuredItems.some(i => i.id === item.Id)) {
                                                featuredItems.push({ id: item.Id, title: item.Name, year: String(year) });
                                                const currentOrder = getSelectedCategoryOrder();
                                                buildCategoryList([...currentOrder, 'featured_' + item.Id]);
                                            }
                                            featuredSearchEl.value = '';
                                            featuredDropdownEl.style.display = 'none';
                                        });
                                        featuredDropdownEl.appendChild(li);
                                    });
                                    featuredDropdownEl.style.display = 'block';
                                } catch (e) {
                                    featuredDropdownEl.style.display = 'none';
                                }
                            }, 250);
                        });

                        featuredSearchEl.addEventListener('blur', () => {
                            setTimeout(() => { featuredDropdownEl.style.display = 'none'; }, 150);
                        });

                        function apiUrl(path, params) {
                            const base = ApiClient.serverAddress();
                            const token = ApiClient.accessToken();
                            const qs = new URLSearchParams(params || {});
                            if (token) qs.set('api_key', token);
                            return base + '/' + path + '?' + qs.toString();
                        }

                        function showStatus(msg, durationMs) {
                            status.textContent = msg;
                            if (durationMs) setTimeout(() => { status.textContent = ''; }, durationMs);
                        }

                        // ── Drag-and-drop category list ───────────────────────────────────────
                        let dragSrc = null;

                        function buildCategoryList(orderedKeys) {
                            categoryList.innerHTML = '';

                            // Static categories
                            const enabledStaticKeys = orderedKeys.filter(k => ALL_CATEGORIES.some(c => c.key === k));
                            const disabledStaticKeys = ALL_CATEGORIES.map(c => c.key).filter(k => !enabledStaticKeys.includes(k));

                            // Featured items
                            const enabledFeaturedIds = orderedKeys
                                .filter(k => k.startsWith('featured_'))
                                .map(k => k.slice('featured_'.length))
                                .filter(id => featuredItems.some(f => f.id === id));
                            const disabledFeaturedIds = featuredItems.map(f => f.id).filter(id => !enabledFeaturedIds.includes(id));

                            // Build display order: ordered valid keys first, then disabled static, then disabled featured
                            const displayKeys = [
                                ...orderedKeys.filter(k =>
                                    ALL_CATEGORIES.some(c => c.key === k) ||
                                    (k.startsWith('featured_') && featuredItems.some(f => f.id === k.slice('featured_'.length)))
                                ),
                                ...disabledStaticKeys,
                                ...disabledFeaturedIds.map(id => 'featured_' + id)
                            ];

                            displayKeys.forEach(key => {
                                const isFeatured = key.startsWith('featured_');
                                let label, enabled;

                                if (isFeatured) {
                                    const id = key.slice('featured_'.length);
                                    const feat = featuredItems.find(f => f.id === id);
                                    if (!feat) return;
                                    label = 'Featured: ' + feat.title + (feat.year ? ' (' + feat.year + ')' : '');
                                    enabled = enabledFeaturedIds.includes(id);
                                } else {
                                    const cat = ALL_CATEGORIES.find(c => c.key === key);
                                    if (!cat) return;
                                    label = cat.label;
                                    enabled = enabledStaticKeys.includes(key);
                                }

                                const li = document.createElement('li');
                                li.dataset.key = key;
                                li.draggable = true;
                                li.style.cssText = [
                                    'display:flex', 'align-items:center', 'gap:10px',
                                    'padding:8px 10px', 'margin-bottom:4px',
                                    isFeatured
                                        ? 'background:var(--cardBackground,rgba(0,164,220,.08))'
                                        : 'background:var(--cardBackground,rgba(255,255,255,.06))',
                                    'border-radius:4px', 'cursor:grab',
                                    'border:1px solid transparent'
                                ].join(';');

                                const handle = document.createElement('span');
                                handle.textContent = '☰';
                                handle.style.cssText = 'opacity:.5;font-size:1.1em;cursor:grab;';

                                const checkbox = document.createElement('input');
                                checkbox.type = 'checkbox';
                                checkbox.id = 'cat-' + key;
                                checkbox.checked = enabled;
                                checkbox.style.margin = '0';

                                const labelEl = document.createElement('label');
                                labelEl.htmlFor = 'cat-' + key;
                                labelEl.textContent = label;
                                labelEl.style.cssText = 'cursor:pointer;flex:1;margin:0;';

                                li.appendChild(handle);
                                li.appendChild(checkbox);
                                li.appendChild(labelEl);

                                if (isFeatured) {
                                    const id = key.slice('featured_'.length);
                                    const removeBtn = document.createElement('button');
                                    removeBtn.type = 'button';
                                    removeBtn.textContent = '✕';
                                    removeBtn.title = 'Remove from list';
                                    removeBtn.style.cssText = 'background:none;border:none;color:var(--textColorSecondary,#aaa);cursor:pointer;font-size:0.9rem;padding:0 4px;line-height:1;flex-shrink:0;';
                                    removeBtn.addEventListener('click', (e) => {
                                        e.stopPropagation();
                                        featuredItems = featuredItems.filter(f => f.id !== id);
                                        buildCategoryList(getSelectedCategoryOrder().filter(k => k !== key));
                                    });
                                    li.appendChild(removeBtn);
                                }

                                // Drag events
                                li.addEventListener('dragstart', e => {
                                    dragSrc = li;
                                    e.dataTransfer.effectAllowed = 'move';
                                    li.style.opacity = '0.4';
                                });
                                li.addEventListener('dragend', () => {
                                    dragSrc = null;
                                    li.style.opacity = '';
                                    categoryList.querySelectorAll('li').forEach(el => {
                                        el.style.border = '1px solid transparent';
                                    });
                                });
                                li.addEventListener('dragover', e => {
                                    e.preventDefault();
                                    e.dataTransfer.dropEffect = 'move';
                                    if (li !== dragSrc) li.style.border = '1px solid var(--accent,#00a4dc)';
                                });
                                li.addEventListener('dragleave', () => {
                                    li.style.border = '1px solid transparent';
                                });
                                li.addEventListener('drop', e => {
                                    e.preventDefault();
                                    li.style.border = '1px solid transparent';
                                    if (dragSrc && dragSrc !== li) {
                                        const items = [...categoryList.querySelectorAll('li')];
                                        const srcIdx = items.indexOf(dragSrc);
                                        const dstIdx = items.indexOf(li);
                                        if (srcIdx < dstIdx) {
                                            categoryList.insertBefore(dragSrc, li.nextSibling);
                                        } else {
                                            categoryList.insertBefore(dragSrc, li);
                                        }
                                    }
                                });

                                categoryList.appendChild(li);
                            });
                        }

                        function getSelectedCategoryOrder() {
                            return [...categoryList.querySelectorAll('li')]
                                .filter(li => li.querySelector('input[type=checkbox]').checked)
                                .map(li => li.dataset.key);
                        }

                        // ── Load config ───────────────────────────────────────────────────────
                        ApiClient.getPluginConfiguration(PLUGIN_ID)
                            .then(async config => {
                                intervalInput.value = (config && config.AutoSlideIntervalSeconds > 0)
                                    ? config.AutoSlideIntervalSeconds : 6;
                                const savedOrder = (config && config.CategoryOrder && config.CategoryOrder.length > 0)
                                    ? config.CategoryOrder
                                    : ALL_CATEGORIES.map(c => c.key);

                                // Load custom list (Featured) items into registry BEFORE building the order list
                                featuredItems = [];
                                const featuredIds = (config && config.FeaturedItemIds) || [];
                                for (const fid of featuredIds) {
                                    try {
                                        const resp = await fetch(apiUrl('Items/' + fid), { credentials: 'same-origin' });
                                        const item = await resp.json();
                                        const year = item.PremiereDate ? String(new Date(item.PremiereDate).getFullYear()) : '';
                                        featuredItems.push({ id: item.Id, title: item.Name, year });
                                    } catch (e) {
                                        featuredItems.push({ id: fid, title: fid, year: '' });
                                    }
                                }
                                buildCategoryList(savedOrder);
                            })
                            .catch(() => {
                                intervalInput.value = 6;
                                buildCategoryList(ALL_CATEGORIES.map(c => c.key));
                            });

                        // ── Save config ───────────────────────────────────────────────────────
                        form.addEventListener('submit', async (e) => {
                            e.preventDefault();
                            const seconds = parseInt(intervalInput.value, 10);
                            if (isNaN(seconds) || seconds < 1) {
                                showStatus('Please enter a valid number of seconds (minimum 1).', 3000);
                                return;
                            }
                            try {
                                const config = await ApiClient.getPluginConfiguration(PLUGIN_ID);
                                config.AutoSlideIntervalSeconds = seconds;
                                config.CategoryOrder = getSelectedCategoryOrder();
                                config.FeaturedItemIds = [...categoryList.querySelectorAll('li')]
                                    .map(li => li.dataset.key)
                                    .filter(k => k.startsWith('featured_'))
                                    .map(k => k.slice('featured_'.length));
                                await ApiClient.updatePluginConfiguration(PLUGIN_ID, config);
                                showStatus('Settings saved.', 2500);
                            } catch (err) {
                                showStatus('Failed to save settings.', 3000);
                            }
                        });

                        // ── Refresh featured items ────────────────────────────────────────────
                        refreshBtn.addEventListener('click', async () => {
                            try {
                                showStatus('Requesting refresh...');
                                const resp = await fetch('/plugins/jellyfeatured/refresh', {
                                    method: 'POST',
                                    credentials: 'same-origin',
                                    headers: { 'Content-Type': 'application/json' }
                                });
                                if (resp.ok) {
                                    showStatus('Refresh started on server.', 2500);
                                    return;
                                }
                            } catch (e) { /* fall through */ }

                            const ts = Date.now().toString();
                            localStorage.setItem('jellyfeatured_refresh', ts);
                            try {
                                const bc = new BroadcastChannel('jellyfeatured');
                                bc.postMessage({ type: 'refresh', ts });
                            } catch (e) {}
                            showStatus('Refresh requested (fallback).', 2500);
                        });

                    })();
                </script>
            </div>
        </div>
    </div>
</body>
</html>
